<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin Traffic Intelligence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8faff;
      color: #1f2937;
      height: 100vh;
      overflow: hidden;
    }

    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 58px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .brand { display: flex; flex-direction: column; }
    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #4338ca;
      letter-spacing: 0.02em;
    }
    .brand-sub {
      font-size: 11px;
      color: #6b7280;
      margin-top: 1px;
    }

    #status-block {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
    }

    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; }
    .stat-value { font-size: 14px; font-weight: 600; color: #1f2937; margin-top: 1px; }

    #refresh-btn {
      background: #4f46e5;
      border: none;
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #refresh-btn:hover { background: #4338ca; }
    #refresh-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: default; }

    #map {
      position: absolute;
      top: 58px; bottom: 0; left: 0; right: 0;
    }

    #legend {
      position: fixed;
      bottom: 28px;
      right: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 18px;
      z-index: 1000;
      min-width: 170px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    #legend h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .leg-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
      font-size: 12px;
      color: #374151;
    }
    .leg-row:last-child { margin-bottom: 0; }
    .leg-swatch {
      width: 28px;
      height: 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #osm-status {
      position: fixed;
      bottom: 28px;
      left: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 14px;
      z-index: 1000;
      font-size: 11px;
      color: #6b7280;
      display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    #osm-status.visible { display: block; }

    /* City label icons */
    .city-label {
      background: transparent;
      border: none;
      color: #374151;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
      white-space: nowrap;
      pointer-events: none;
    }

    /* Leaflet popup overrides */
    .leaflet-popup-content-wrapper {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }
    .leaflet-popup-tip { background: #ffffff; }
    .leaflet-popup-content { margin: 14px 16px; }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #4338ca;
      margin-bottom: 10px;
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #f3f4f6;
      gap: 12px;
    }
    .popup-row:last-of-type { border-bottom: none; }
    .popup-key { color: #6b7280; white-space: nowrap; }
    .popup-val { color: #111827; font-weight: 500; text-align: right; }
    .popup-footer {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="brand-title">Austin Traffic Intelligence</div>
    <div class="brand-sub">Live congestion · ML predictions · OSM street network</div>
  </div>
  <div id="status-block">
    <div class="stat-item">
      <span class="stat-label">Last Updated</span>
      <span class="stat-value" id="last-updated">Loading…</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Next Refresh</span>
      <span class="stat-value" id="countdown">30:00</span>
    </div>
  </div>
  <button id="refresh-btn" onclick="triggerRefresh()">↻ Refresh Now</button>
</div>

<div id="map"></div>

<div id="legend">
  <h4>Congestion Level</h4>
  <div class="leg-row"><div class="leg-swatch" style="background:#00c853"></div>Free Flow</div>
  <div class="leg-row"><div class="leg-swatch" style="background:#c6e000"></div>Light</div>
  <div class="leg-row"><div class="leg-swatch" style="background:#ffd600"></div>Moderate</div>
  <div class="leg-row"><div class="leg-swatch" style="background:#ff6d00"></div>Heavy</div>
  <div class="leg-row"><div class="leg-swatch" style="background:#d50000"></div>Severe</div>
  <div class="leg-row" style="margin-top:8px;border-top:1px solid #e5e7eb;padding-top:8px;">
    <div class="leg-swatch" style="background:#94a3b8"></div>Other roads
  </div>
</div>

<div id="osm-status">Loading street network…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ── 30-mile radius from Austin city center ────────────────────────────────
  const AUSTIN_CENTER = [30.2672, -97.7431];
  const RADIUS_MI     = 30;
  const RADIUS_M      = RADIUS_MI * 1609.344;   // 48,280.3 m

  // Bounding box that fully contains the 30-mi circle (used for pan lock + Overpass)
  // 30 mi ≈ 0.435° lat, 0.504° lon at latitude 30.27°
  const BOUNDS = L.latLngBounds(
    L.latLng(29.83, -98.25),   // SW corner — just outside the circle
    L.latLng(30.70, -97.24)    // NE corner — just outside the circle
  );

  const map = L.map('map', {
    zoomControl: true,
    maxBounds: BOUNDS,
    maxBoundsViscosity: 1.0,
    minZoom: 10,
    maxZoom: 17
  }).setView(AUSTIN_CENTER, 11);

  // Light OSM-based basemap (CARTO)
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }
  ).addTo(map);

  // ── 30-mile solid mask ────────────────────────────────────────────────────
  // Build a GeoJSON Polygon: outer ring = world rectangle, inner ring = circle
  // (reversed winding). Fully opaque white so tiles outside the 30-mile
  // boundary are completely hidden — nothing is visible beyond the border.
  function buildCirclePolygon(centerLat, centerLng, radiusM, steps) {
    const R   = 6371000;
    const lat = centerLat * Math.PI / 180;
    const lon = centerLng * Math.PI / 180;
    const d   = radiusM / R;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const bearing = (i * 2 * Math.PI) / steps;
      const pLat = Math.asin(
        Math.sin(lat) * Math.cos(d) +
        Math.cos(lat) * Math.sin(d) * Math.cos(bearing)
      );
      const pLon = lon + Math.atan2(
        Math.sin(bearing) * Math.sin(d) * Math.cos(lat),
        Math.cos(d) - Math.sin(lat) * Math.sin(pLat)
      );
      pts.push([pLon * 180 / Math.PI, pLat * 180 / Math.PI]);  // GeoJSON [lon, lat]
    }
    return pts;
  }

  const worldRing  = [[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]];
  const circleRing = buildCirclePolygon(AUSTIN_CENTER[0], AUSTIN_CENTER[1], RADIUS_M, 128);

  L.geoJSON({
    type: 'Feature',
    geometry: {
      type: 'Polygon',
      coordinates: [worldRing, circleRing.slice().reverse()]  // reversed = hole
    }
  }, {
    style: {
      fillColor:   '#ffffff',
      fillOpacity: 1.0,          // fully opaque — nothing shows through
      stroke:      false,
    },
    interactive: false,
  }).addTo(map);

  // Clean solid border ring at the 30-mile boundary
  L.circle(AUSTIN_CENTER, {
    radius:      RADIUS_M,
    color:       '#94a3b8',
    weight:      2,
    fill:        false,
    opacity:     0.7,
    interactive: false,
  }).addTo(map);

  // ── City reference labels ──────────────────────────────────────────────────
  const CITIES = [
    { name: 'Austin',           lat: 30.2672, lng: -97.7431 },
    { name: 'Round Rock',       lat: 30.5082, lng: -97.6789 },
    { name: 'Cedar Park',       lat: 30.5052, lng: -97.8203 },
    { name: 'Pflugerville',     lat: 30.4393, lng: -97.6200 },
    { name: 'Manor',            lat: 30.3449, lng: -97.5565 },
    { name: 'Buda',             lat: 30.0852, lng: -97.8403 },
    { name: 'Dripping Springs', lat: 30.1907, lng: -98.0867 },
    { name: 'Lakeway',          lat: 30.3573, lng: -97.9766 },
  ];

  CITIES.forEach(city => {
    L.marker([city.lat, city.lng], {
      icon: L.divIcon({
        className: 'city-label',
        html: city.name,
        iconAnchor: [0, 0]
      }),
      interactive: false
    }).addTo(map);
  });

  // ── Congestion colors ──────────────────────────────────────────────────────
  const COLORS = {
    'Free Flow':   '#00c853',
    'Light':       '#c6e000',
    'Moderate':    '#ffd600',
    'Heavy':       '#ff6d00',
    'Severe':      '#d50000',
    'unavailable': '#555577'
  };

  // Road weight by highway class
  const ROAD_WEIGHT = {
    motorway: 5, motorway_link: 3,
    trunk: 4,    trunk_link: 3,
    primary: 3,  primary_link: 2,
    secondary: 2, secondary_link: 1.5,
    tertiary: 1.5
  };

  // ── Corridor → OSM name patterns ──────────────────────────────────────────
  // Match OSM way names to our monitored corridors so we can color the roads
  const CORRIDOR_PATTERNS = {
    'I-35_Downtown':              [/interstate\s*35/i, /\bi.?35\b/i, /\bi-35\b/i],
    'Mopac_Expressway_Downtown':  [/mopac/i, /loop\s*1\b/i],
    'US-183_North':               [/\b183\b/, /ed\s+bluestein/i, /research\s+blvd/i, /research\s+boulevard/i, /us.?183/i],
    'Loop-360_West':              [/capital\s+of\s+texas/i, /loop\s*360/i, /\b360\b/],
    'Congress_Ave_Downtown':      [/congress\s+ave/i, /congress\s+avenue/i],
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let activeMarkers  = {};     // corridor name → Leaflet circle
  let osmRoadLayers  = [];     // all drawn road polylines
  let corridorData   = [];     // latest corridor readings
  let secondsLeft    = 1800;
  let refreshing     = false;

  // ── OSM Overpass fetch ─────────────────────────────────────────────────────
  // Bounding box: lat_min,lon_min,lat_max,lon_max
  const OVERPASS_BBOX  = '29.83,-98.25,30.70,-97.24';
  const OVERPASS_URL   = 'https://overpass-api.de/api/interpreter';

  async function fetchOSMRoads() {
    const query = `
[out:json][timeout:30];
(
  way["highway"~"motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary"](${OVERPASS_BBOX});
);
out geom;
    `.trim();

    const resp = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(query)
    });
    if (!resp.ok) throw new Error(`Overpass HTTP ${resp.status}`);
    return resp.json();
  }

  function corridorForWay(wayName) {
    if (!wayName) return null;
    for (const [cName, patterns] of Object.entries(CORRIDOR_PATTERNS)) {
      if (patterns.some(rx => rx.test(wayName))) return cName;
    }
    return null;
  }

  function congestionColorForCorridor(cName) {
    const c = corridorData.find(d => d.corridor_name === cName);
    if (!c) return null;
    return COLORS[c.congestion_label] || COLORS.unavailable;
  }

  function drawOSMRoads(osmData) {
    // Clear previous road layers
    osmRoadLayers.forEach(l => map.removeLayer(l));
    osmRoadLayers = [];

    osmData.elements.forEach(way => {
      if (!way.geometry || way.geometry.length < 2) return;

      const hwType  = way.tags?.highway || 'secondary';
      const wayName = way.tags?.name || way.tags?.['name:en'] || '';
      const cName   = corridorForWay(wayName);
      const color   = cName
        ? (congestionColorForCorridor(cName) || '#6366f1')
        : '#94a3b8';
      const weight  = ROAD_WEIGHT[hwType] || 1.5;

      const latlngs = way.geometry.map(pt => [pt.lat, pt.lon]);
      const line = L.polyline(latlngs, {
        color,
        weight: cName ? weight + 1.5 : weight,   // highlight monitored roads
        opacity: cName ? 0.92 : 0.55,
        smoothFactor: 1.5
      });

      // Tooltip for named roads
      if (wayName) {
        const label = cName
          ? `${wayName} — ${corridorData.find(d => d.corridor_name === cName)?.congestion_label || ''}`
          : wayName;
        line.bindTooltip(label, { sticky: true, className: 'leaflet-tooltip' });
      }

      line.addTo(map);
      osmRoadLayers.push(line);
    });
  }

  async function loadOSMStreets() {
    const statusEl = document.getElementById('osm-status');
    statusEl.textContent = 'Loading street network from OpenStreetMap…';
    statusEl.classList.add('visible');
    try {
      const osmData = await fetchOSMRoads();
      drawOSMRoads(osmData);
      statusEl.textContent = `Street network loaded (${osmData.elements.length} segments)`;
      setTimeout(() => statusEl.classList.remove('visible'), 3000);
    } catch (err) {
      console.warn('OSM street load failed:', err);
      statusEl.textContent = 'Street network unavailable — using base tiles';
      setTimeout(() => statusEl.classList.remove('visible'), 4000);
    }
  }

  // ── Corridor circle popup ──────────────────────────────────────────────────
  function buildPopup(c) {
    const color = COLORS[c.congestion_label] || COLORS.unavailable;
    const pct = c.predicted_congestion_index != null
      ? (c.predicted_congestion_index * 100).toFixed(1) + '%'
      : 'N/A';
    const eventsVal = c.nearby_event_count > 0
      ? `${c.nearby_event_count}${c.has_high_impact_event ? ' ⚠ high impact' : ''}`
      : 'None nearby';

    return `
      <div class="popup-title">${c.display_name}</div>
      <div class="popup-row">
        <span class="popup-key">Status</span>
        <span class="popup-val" style="color:${color};font-weight:700">${c.congestion_label}</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Predicted index</span>
        <span class="popup-val">${pct}</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Current speed</span>
        <span class="popup-val">${c.current_speed_mph} mph</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Free-flow speed</span>
        <span class="popup-val">${c.free_flow_speed_mph} mph</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Weather</span>
        <span class="popup-val">${c.weather_condition}, ${c.weather_temp_f}°F</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Weather impact</span>
        <span class="popup-val">${c.weather_traffic_impact_level}</span>
      </div>
      <div class="popup-row">
        <span class="popup-key">Nearby events</span>
        <span class="popup-val">${eventsVal}</span>
      </div>
      <div class="popup-footer">Data snapshot: ${new Date(c.timestamp).toLocaleString()}</div>
    `;
  }

  // ── Fetch corridor data & render ───────────────────────────────────────────
  async function fetchAndRender() {
    refreshing = true;
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = '↻ Refreshing…';

    try {
      const res = await fetch('/api/map/corridors');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      corridorData = await res.json();

      // Remove old markers
      Object.values(activeMarkers).forEach(m => map.removeLayer(m));
      activeMarkers = {};

      corridorData.forEach(c => {
        const color = COLORS[c.congestion_label] || COLORS.unavailable;
        const idx   = c.predicted_congestion_index ?? c.congestion_index ?? 0;
        const radius = 320 + idx * 750;

        const circle = L.circle([c.latitude, c.longitude], {
          color,
          fillColor: color,
          fillOpacity: 0.45,
          weight: c.congestion_label === 'Heavy' || c.congestion_label === 'Severe' ? 3 : 2,
          radius
        }).addTo(map);

        circle.bindPopup(buildPopup(c), { maxWidth: 280 });
        activeMarkers[c.corridor_name] = circle;
      });

      document.getElementById('last-updated').textContent =
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      secondsLeft = 1800;

      // Re-color road polylines with fresh congestion data
      drawOSMRoads._lastData && drawOSMRoads._lastData.elements.length > 0
        ? drawOSMRoads(drawOSMRoads._lastData)
        : void 0;

    } catch (err) {
      console.error('Fetch error:', err);
      document.getElementById('last-updated').textContent = 'Error — retrying';
      secondsLeft = 30;
    } finally {
      refreshing = false;
      btn.disabled = false;
      btn.textContent = '↻ Refresh Now';
    }
  }

  // Wrap drawOSMRoads to cache last OSM data for re-coloring after refreshes
  const _origDraw = drawOSMRoads;
  drawOSMRoads = function(osmData) {
    drawOSMRoads._lastData = osmData;
    _origDraw(osmData);
  };
  drawOSMRoads._lastData = { elements: [] };

  // ── Timer ──────────────────────────────────────────────────────────────────
  function fmt(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function triggerRefresh() { secondsLeft = 1; }

  function tick() {
    if (refreshing) return;
    secondsLeft = Math.max(0, secondsLeft - 1);
    document.getElementById('countdown').textContent =
      secondsLeft === 0 ? 'Now…' : fmt(secondsLeft);
    if (secondsLeft === 0) fetchAndRender();
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  // Fetch corridor data first, then load OSM streets so roads can be colored immediately
  fetchAndRender().then(() => loadOSMStreets());
  setInterval(tick, 1000);
</script>
</body>
</html>
