# Netlify config for the React + kepler.gl frontend.
# Deploy: Netlify → "Add new site" → "Import from Git" → pick this repo.
# Netlify auto-detects this file; the settings below override the UI.
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  # CRA needs the build to succeed even with lint warnings.
  CI = "false"
  NODE_VERSION = "20"
  # ── Backend API base URL ───────────────────────────────────────────────────
  # Backend runs on a Hugging Face Docker Space (2 vCPU) so the ML forecast
  # endpoints work.
  # (You can also override REACT_APP_API_BASE_URL in the Netlify UI.)
  REACT_APP_API_BASE_URL = "https://vtejas00-austin-traffic-api.hf.space"

# Single-page app: serve index.html for any client-side route.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
